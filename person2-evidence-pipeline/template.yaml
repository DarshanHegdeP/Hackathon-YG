AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  person2-evidence-pipeline
  Stack 2: Evidence Collection, Storage & Document Processing Pipeline for Banking LOD2 Control Testing.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.11
    Tracing: Active
    Environment:
      Variables:
        DYNAMODB_REQUESTS_TABLE: !Ref EvidenceRequestsTable
        DYNAMODB_EVIDENCE_TABLE: !Ref EvidenceTable
        EVIDENCE_S3_BUCKET: !Ref EvidenceBucket
        EVENT_BUS_NAME: default

Resources:
  # -------------------------------------------------------------
  # S3 Encrypted Evidence Bucket
  # -------------------------------------------------------------
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - '*'
            MaxAge: 3600

  # -------------------------------------------------------------
  # DynamoDB: EvidenceRequests Table
  # PK: requestId, GSI: reviewControlId-index
  # -------------------------------------------------------------
  EvidenceRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-EvidenceRequests"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: reviewControlId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: reviewControlId-index
          KeySchema:
            - AttributeName: reviewControlId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # -------------------------------------------------------------
  # DynamoDB: Evidence Table
  # PK: evidenceId, GSI: reviewControlId-index
  # -------------------------------------------------------------
  EvidenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Evidence"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: evidenceId
          AttributeType: S
        - AttributeName: reviewControlId
          AttributeType: S
      KeySchema:
        - AttributeName: evidenceId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: reviewControlId-index
          KeySchema:
            - AttributeName: reviewControlId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # -------------------------------------------------------------
  # API Gateway REST API
  # -------------------------------------------------------------
  EvidenceApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # -------------------------------------------------------------
  # Lambda: API Handler Function
  # -------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.handlers.api_handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EvidenceRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EvidenceTable
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket
        - EventBridgePutEventsPolicy:
            EventBusName: default
      Events:
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref EvidenceApi
            Path: /health
            Method: GET
        CreateEvidenceRequest:
          Type: Api
          Properties:
            RestApiId: !Ref EvidenceApi
            Path: /evidence-requests
            Method: POST
        ListEvidenceRequests:
          Type: Api
          Properties:
            RestApiId: !Ref EvidenceApi
            Path: /review-controls/{reviewControlId}/evidence-requests
            Method: GET
        GenerateUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref EvidenceApi
            Path: /evidence/upload-url
            Method: POST
        ConfirmUpload:
          Type: Api
          Properties:
            RestApiId: !Ref EvidenceApi
            Path: /evidence/{evidenceId}/confirm
            Method: POST
        GetEvidence:
          Type: Api
          Properties:
            RestApiId: !Ref EvidenceApi
            Path: /evidence/{evidenceId}
            Method: GET

  # -------------------------------------------------------------
  # Lambda: Document Processor Function (Triggered by S3 or /confirm)
  # -------------------------------------------------------------
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.handlers.processor_handler.lambda_handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EvidenceRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EvidenceTable
        - S3ReadPolicy:
            BucketName: !Ref EvidenceBucket
        - EventBridgePutEventsPolicy:
            EventBusName: default
      Events:
        S3NewObject:
          Type: S3
          Properties:
            Bucket: !Ref EvidenceBucket
            Events: s3:ObjectCreated:*

Outputs:
  EvidenceApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${EvidenceApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  EvidenceBucketName:
    Description: "S3 Encrypted Evidence Bucket"
    Value: !Ref EvidenceBucket

  EvidenceRequestsTableName:
    Description: "DynamoDB EvidenceRequests table name"
    Value: !Ref EvidenceRequestsTable

  EvidenceTableName:
    Description: "DynamoDB Evidence table name"
    Value: !Ref EvidenceTable
